name = "crimescenecleanerjobs"
main = "workers/site.js"
compatibility_date = "2026-05-11"

[vars]
PUBLIC_SITE_URL = "https://crimescenecleanerjobs.com"
DEFAULT_SCAN_LOCATION = "Nationwide"
JOB_SCAN_QUERIES = "crime scene cleanup technician;biohazard remediation technician;trauma scene cleanup jobs;hazmat cleanup technician"
AUTO_PUBLISH_JOBS = "false"
AUTO_PUBLISH_MANUAL_JOBS = "false"
SITE_KEYWORDS = "biohazard remediation, crime scene cleanup, trauma cleaning, hazmat technician"
AUTO_PUBLISH_CONFIDENCE = "0.92"
FETCH_SOURCE_PAGES = "false"
EDIT_CODE_DAYS = "30"
RETURN_EDIT_CODE_AFTER_EMAIL = "false"
CLAUDE_MODEL = "claude-haiku-4-5-20251001"
FROM_EMAIL = "CrimeSceneCleanerJobs <no-reply@crimescenecleanerjobs.com>"
GOOGLE_INDEXING_ENABLED = "true"

# ── Clone config ──────────────────────────────────────────────────────────────
# Change these per clone. Everything else (DB, secrets) gets set via wrangler.
SITE_NAME = "CrimeSceneCleanerJobs"
SITE_TITLE = "CrimeSceneCleanerJobs — Find Your Next Mission"
SITE_DESCRIPTION = "CrimeSceneCleanerJobs is the premier job board for biohazard remediation, trauma scene cleanup, and environmental hazard specialists. No fluff. Just real jobs."
SITE_TAGLINE = "The premier dispatch board for biohazard remediation, trauma cleanup, and environmental hazard specialists."
SITE_HERO_HEADLINE = "Restore Order."
SITE_HERO_SUBHEADING = "Find Your Next Mission."
SITE_BRAND_LABEL = "The Elite Network"
NICHE_DESCRIPTION = "biohazard remediation and crime scene cleanup"
NICHE_EXAMPLE_QUERY = "where can I find biohazard cleanup jobs?"
STRIPE_CHECKOUT_URL = "https://buy.stripe.com/6oU14mbCsbzo2sOb7G24000"

[[d1_databases]]
binding = "DB"
database_name = "crimescenecleanerjobs"
database_id = "8c325955-88e1-4d55-bb9a-f53730386f25"
migrations_dir = "migrations"

[triggers]
crons = ["0 3 * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
